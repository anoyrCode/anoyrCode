# Regenerates the images used in README.md:
#   profile-assets/      → stats + top-langs cards (dark & light) and the snake
#   profile-3d-contrib/  → 3D contribution calendar
# Runs twice a day, on manual trigger, and whenever this file changes.

name: Generate profile assets

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ── Stats cards (self-generated, no flaky public API) ──────────────
      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=0d1117&title_color=f59e0b&icon_color=f59e0b&text_color=c9d1d9&ring_color=f59e0b"
          path: profile-assets/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=ffffff&title_color=b45309&icon_color=d97706&text_color=1c0a00&ring_color=b45309"
          path: profile-assets/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0d1117&title_color=f59e0b&text_color=c9d1d9"
          path: profile-assets/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=ffffff&title_color=b45309&text_color=1c0a00"
          path: profile-assets/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Snake eating the contribution grid (amber palette) ─────────────
      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-assets/snake-dark.svg?palette=github-dark&color_snake=#f59e0b&color_dots=#161b22,#3b1d06,#78350f,#b45309,#f59e0b
            profile-assets/snake-light.svg?color_snake=#b45309&color_dots=#ebedf0,#fde68a,#fbbf24,#d97706,#92400e

      # ── 3D contribution calendar ───────────────────────────────────────
      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # ── Commit whatever changed ───────────────────────────────────────
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets profile-3d-contrib
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: refresh profile assets"
          git pull --rebase
          git push
